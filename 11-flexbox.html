<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Flex Box</title>
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	</head>
	<body>
		<div class="flex justify-center items-center h-screen bg-gray-100 gap-4">
			<div class="w-32 h-32 bg-blue-400">Elemento 1</div>
			<div class="w-32 h-32 bg-pink-400">Elemento 2</div>
			<div class="w-32 h-32 bg-orange-400">Elemento 3</div>
		</div>
		<div class="flex flex-col items-center gap-4 h-screen bg-gray-200 py-4">
			<div class="w-32 h-32 bg-blue-400">Elemento 1</div>
			<div class="w-32 h-32 bg-pink-400">Elemento 2</div>
			<div class="w-32 h-32 bg-orange-400">Elemento 3</div>
		</div>
		<div
			class="gap-4 h-screen bg-gray-300 py-4 flex justify-between items-center"
		>
			<div class="w-32 h-32 bg-blue-400 flex items-center justify-center">
				Elemento 1
			</div>
			<div class="w-32 h-32 bg-pink-400">Elemento 2</div>
			<div class="w-32 h-32 bg-orange-400">Elemento 3</div>
		</div>

		<div class="flex h-screen bg-gray-400 py-4">
			<div class="flex-1 bg-blue-400">Elemento 1</div>
			<div class="flex-1 bg-pink-400">Elemento 2</div>
			<div class="flex-none bg-orange-400">Elemento 3</div>
		</div>
	</body>
</html>
